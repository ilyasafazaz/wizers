<div class="home-container">
  <div class="overlay">
    <img src="assets/logo.png" alt="WIZERS Logo" class="logo-image">
    <p class="subtext">
      La plateforme digitale dédiée aux seniors, alliant sagesse et plaisir de vivre.
    </p>

    <app-search-bar></app-search-bar>

    <!-- Main Blocks -->
    <div class="categories">
      <div
        class="category-block"
        *ngFor="let block of mainBlocks; let i = index"
        (click)="navigateToEspace()"
      >
        <i class="pi" [ngClass]="getIcon(i)"></i>
        <span>{{ block }}</span>
      </div>

      <!-- Voir plus block -->
      <!-- <div class="category-block">
        <i class="pi pi-ellipsis-h"></i>
        <button pButton (click)="showMore = !showMore">Voir plus</button>
      </div>
    </div> -->

    <!-- More Blocks -->
    <div class="categories more" *ngIf="showMore">
      <div
        class="category-block"
        *ngFor="let block of moreBlocks"
        (click)="navigateToEspace()"
      >
        <i class="pi pi-plus-circle"></i>
        <span>{{ block }}</span>
      </div>
    </div>
  </div>
</div>
