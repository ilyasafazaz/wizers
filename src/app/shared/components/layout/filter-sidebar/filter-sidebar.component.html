<div class="filter-sidebar">
  <div class="sidebar-header">
    <h3>
      <i class="pi pi-filter"></i>
      Filtres
    </h3>
    <button class="close-btn" (click)="onCloseSidebar()">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div class="sidebar-content">
    <!-- Espace Filter -->
    <div class="filter-section">
      <label class="filter-label">
        <i class="pi pi-home"></i>
        Espace
      </label>
      <p-dropdown
        [options]="espaceOptions"
        [(ngModel)]="localFilters.selectedEspace"
        optionLabel="label"
        optionValue="value"
        placeholder="Sélectionner un espace"
        [showClear]="true"
        (onChange)="onFilterChange()"
        styleClass="w-full"
      ></p-dropdown>
    </div>

    <!-- Menu Filter -->
    <div class="filter-section" *ngIf="menuOptions.length > 0">
      <label class="filter-label">
        <i class="pi pi-list"></i>
        Section
      </label>
      <p-dropdown
        [options]="menuOptions"
        [(ngModel)]="localFilters.selectedMenu"
        optionLabel="label"
        optionValue="value"
        placeholder="Sélectionner une section"
        [showClear]="true"
        (onChange)="onFilterChange()"
        styleClass="w-full"
      ></p-dropdown>
    </div>

    <!-- Main Category Filter -->
    <div class="filter-section" *ngIf="mainCategoryOptions.length > 0">
      <label class="filter-label">
        <i class="pi pi-tags"></i>
        Catégorie principale
      </label>
      <p-dropdown
        [options]="mainCategoryOptions"
        [(ngModel)]="localFilters.selectedMainCategory"
        optionLabel="label"
        optionValue="value"
        placeholder="Sélectionner une catégorie"
        [showClear]="true"
        (onChange)="onFilterChange()"
        styleClass="w-full"
      ></p-dropdown>
    </div>

    <!-- Sub Category Filter -->
    <div class="filter-section" *ngIf="subCategoryOptions.length > 0">
      <label class="filter-label">
        <i class="pi pi-tag"></i>
        Sous-catégorie
      </label>
      <p-dropdown
        [options]="subCategoryOptions"
        [(ngModel)]="localFilters.selectedSubCategory"
        optionLabel="label"
        optionValue="value"
        placeholder="Sélectionner une sous-catégorie"
        [showClear]="true"
        (onChange)="onFilterChange()"
        styleClass="w-full"
      ></p-dropdown>
    </div>

    <!-- Clear All Filters -->
    <div class="filter-actions">
      <button
        class="clear-filters-btn"
        (click)="clearAllFilters()"
        [disabled]="!hasActiveFilters()"
      >
        <i class="pi pi-refresh"></i>
        Effacer tous les filtres
      </button>
    </div>
  </div>
</div>
